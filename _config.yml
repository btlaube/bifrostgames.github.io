title: BifrostGames
description: Indie games and game development by Ben Laube.

collections:
  games:
    output: true
    permalink: /games/:name/
  devlogs:
    output: true
    permalink: /devlogs/:path/
  devlog_hubs:
    output: true
    permalink: /devlogs/:name/

defaults:
  - scope: { path: "", type: games }
    values:
      layout: game
      css: game
      noindex: true      # remove at switch-over
  - scope: { path: "", type: devlogs }
    values:
      layout: devlog
      css: devlog
      noindex: true
  - scope: { path: "", type: devlog_hubs }
    values:
      layout: devlog-hub
      css: devlog
      noindex: true

exclude:
  - _tools/